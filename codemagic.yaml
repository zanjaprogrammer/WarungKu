workflows:
  android-workflow:
    name: Android Build Workflow - WarungKu
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - codemagic_android_keystore # Add keystore credentials in Codemagic UI
        - supabase_config # Add Supabase config in Codemagic UI
      vars:
        PACKAGE_NAME: "com.zanjaprogrammer.warungku"
        CM_KEYSTORE_PATH: "/tmp/keystore.jks"
        # Keystore credentials - default values (can be overridden by environment variables)
        CM_KEYSTORE_PASSWORD: "123456789"
        CM_KEY_ALIAS: "alkahf"
        CM_KEY_PASSWORD: "123456789"
        # Supabase Configuration (set these in Codemagic UI as environment variables)
        SUPABASE_URL: $SUPABASE_URL
        SUPABASE_PUBLISHABLE_KEY: $SUPABASE_PUBLISHABLE_KEY
        SUPABASE_SECRET_KEY: $SUPABASE_SECRET_KEY
        # AdMob Configuration (optional - for validation)
        ADMOB_APP_ID: $ADMOB_APP_ID
        # Email recipient for notifications
        EMAIL_RECIPIENT: $EMAIL_RECIPIENT
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      
      - name: Set up Supabase config
        script: |
          # Create Supabase config file from environment variables
          mkdir -p app/src/main/res/raw
          cat > app/src/main/res/raw/supabase_config.properties << EOF
          # Supabase Configuration
          # DO NOT COMMIT THIS FILE TO GIT!
          
          # Project URL
          SUPABASE_URL=$SUPABASE_URL
          
          # Publishable Key (Safe untuk client-side)
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          
          # Secret Key (Hanya untuk server-side, JANGAN expose di client!)
          SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY
          EOF
          echo "✅ Supabase config created"
      
      - name: Set up Google Services (if needed)
        script: |
          # google-services.json should be committed to repo or added via environment variable
          if [ ! -f "app/google-services.json" ]; then
            echo "⚠️ Warning: google-services.json not found"
            echo "If using Firebase, add google-services.json to the repository"
          fi
      
      - name: Validate AdMob Configuration
        script: |
          echo "🎯 Validating AdMob configuration for production build..."
          
          # Check if production config exists
          if [ -f "app/src/main/assets/ads_config_production.json" ]; then
            echo "✅ Production AdMob config found"
            
            # Check if production config has placeholder values
            if grep -q "XXXXXXXXXXXXXXXXX" app/src/main/assets/ads_config_production.json; then
              echo "⚠️ WARNING: Production AdMob config contains placeholder values!"
              echo "⚠️ Please replace XXXXXXXXXXXXXXXXX with your real AdMob ad unit IDs"
              echo "⚠️ Current production config:"
              cat app/src/main/assets/ads_config_production.json
              echo ""
              echo "💡 The build will continue, but ads may not work properly in production"
              echo "💡 Update app/src/main/assets/ads_config_production.json with real ad unit IDs"
            else
              echo "✅ Production AdMob config appears to be properly configured"
              # Show config name and test mode status (without exposing ad unit IDs)
              echo "📋 Production config details:"
              grep -E '"configName"|"testMode"|"description"' app/src/main/assets/ads_config_production.json
            fi
          else
            echo "❌ ERROR: Production AdMob config not found!"
            echo "❌ Expected: app/src/main/assets/ads_config_production.json"
            echo "💡 This file is required for production builds"
            exit 1
          fi
          
          # Check if test config exists (should always be there)
          if [ -f "app/src/main/assets/ads_config_test.json" ]; then
            echo "✅ Test AdMob config found (fallback available)"
          else
            echo "⚠️ Warning: Test AdMob config not found"
          fi
          
          echo "🎯 AdMob configuration validation complete"
      
      - name: Set up keystore
        script: |
          # Keystore will be set up from Codemagic UI environment variables
          if [ -n "$CM_KEYSTORE" ]; then
            echo "🔐 Setting up keystore from CM_KEYSTORE environment variable..."
            echo $CM_KEYSTORE | base64 --decode > $CM_KEYSTORE_PATH
            if [ -f "$CM_KEYSTORE_PATH" ]; then
              echo "✅ Keystore file created at $CM_KEYSTORE_PATH"
              ls -lh $CM_KEYSTORE_PATH
            else
              echo "❌ Failed to create keystore from CM_KEYSTORE"
            fi
          else
            echo "⚠️ CM_KEYSTORE not set. Checking for local keystore..."
            if [ -f "app/alkahf.jks" ]; then
              echo "✅ Found local keystore, copying to $CM_KEYSTORE_PATH"
              cp app/alkahf.jks $CM_KEYSTORE_PATH
              if [ -f "$CM_KEYSTORE_PATH" ]; then
                ls -lh $CM_KEYSTORE_PATH
              fi
            else
              echo "⚠️ No keystore found. Will build debug APK only."
              echo "💡 To build release AAB, set CM_KEYSTORE environment variable in Codemagic UI"
              echo "💡 Generate base64: base64 -i app/alkahf.jks | pbcopy"
            fi
          fi
      
      - name: Build Android App Bundle (AAB) Release
        script: |
          if [ -f "$CM_KEYSTORE_PATH" ]; then
            echo "🔨 Building signed AAB release..."
            ./gradlew bundleRelease
          else
            echo "⚠️ Skipping AAB release build - keystore not available"
            echo "💡 Set CM_KEYSTORE environment variable to build release AAB"
          fi
      
      - name: Build APK Release
        script: |
          if [ -f "$CM_KEYSTORE_PATH" ]; then
            echo "🔨 Building signed APK release..."
            ./gradlew assembleRelease
          else
            echo "⚠️ Skipping APK release build - keystore not available"
            echo "💡 Set CM_KEYSTORE environment variable to build release APK"
          fi
      
      - name: Build Debug APK (always)
        script: |
          echo "🔨 Building debug APK..."
          ./gradlew assembleDebug
      
      - name: Build Summary
        script: |
          echo "📋 WarungKu Build Summary"
          echo "========================"
          echo "📱 Package: $PACKAGE_NAME"
          echo "🏗️ Build Type: Release (production AdMob config will be used automatically)"
          echo "🎯 AdMob Config: Production JSON will be loaded for release builds"
          echo "🔐 Keystore: $([ -f "$CM_KEYSTORE_PATH" ] && echo "✅ Available" || echo "❌ Not found")"
          echo "🔥 Firebase: $([ -f "app/google-services.json" ] && echo "✅ Configured" || echo "⚠️ Not found")"
          echo "☁️ Supabase: $([ -n "$SUPABASE_URL" ] && echo "✅ Configured" || echo "⚠️ Not configured")"
          echo ""
          echo "📦 Build Artifacts:"
          if [ -f "$CM_KEYSTORE_PATH" ]; then
            echo "  • AAB Release (signed)"
            echo "  • APK Release (signed)"
          fi
          echo "  • APK Debug"
          echo ""
          echo "🎯 AdMob Configuration Notes:"
          echo "  • Release builds automatically use production AdMob configuration"
          echo "  • Debug builds automatically use test AdMob configuration"
          echo "  • Configuration is loaded from JSON files in app/src/main/assets/"
          echo "  • No code changes needed - automatic detection based on build type"
          echo ""
          echo "✅ Build configuration validated and ready!"
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - $EMAIL_RECIPIENT
        notify:
          success: true
          failure: true
      scripts:
        - name: Publish to Google Play (optional)
          script: |
            # Uncomment dan configure jika ingin auto-publish ke Play Store
            # fastlane android deploy
            echo "📦 Build artifacts ready for download"

